<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple to-do list that keeps your tasks in your browser.">
    <meta name="theme-color" content="#0f201d">
    <title>To-Do List</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 id="today">To-Do List</h1>
            <p id="summary" class="summary" aria-live="polite"></p>
            <div id="progress" class="progress" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </header>

        <form id="todo-form" class="input-container">
            <input type="text" id="todo-input" placeholder="Add a new task" aria-label="Add a new task" autocomplete="off">
            <button type="submit" id="add-task-btn">Add task</button>
        </form>

        <div id="filters" class="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All <span id="count-all"></span></button>
            <button type="button" data-filter="active" aria-pressed="false">Active <span id="count-active"></span></button>
            <button type="button" data-filter="completed" aria-pressed="false">Done <span id="count-completed"></span></button>
        </div>

        <ul id="todo-list"></ul>

        <div id="empty" class="empty" hidden>
            <h2 id="empty-title"></h2>
            <p id="empty-text"></p>
        </div>
    </main>

    <template id="task-template">
        <li class="task">
            <label class="task-label">
                <input type="checkbox">
                <span class="task-text"><span></span></span>
            </label>
            <button type="button" class="task-delete">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
                </svg>
            </button>
        </li>
    </template>

    <script src="script.js"></script>
</body>
</html>
